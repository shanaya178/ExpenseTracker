<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google Login</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        main {
            max-width: 640px;
            margin: 48px auto;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        a {
            color: #4f46e5;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="auth-gate">
        <div class="auth-card">
            <p class="auth-kicker">My Dashboard</p>
            <h1 id="auth-title">Sign in to continue</h1>
            <p id="auth-status">Checking your Google session…</p>
            <button id="google-sign-in" type="button" hidden>
                <span class="g-logo" aria-hidden="true"></span>
                Sign in with Google
            </button>
            <p id="auth-error" role="alert"></p>
        </div>
    </div>

    <main>
        <div class="card">
            <h1>Firebase Google Login</h1>
            <p>You are signed in with the same Firebase project used by the rest of the dashboard.</p>
            <p>Name: <strong id="userName"></strong></p>
            <p>Email: <strong id="userEmail"></strong></p>
            <p>User ID: <strong id="userId"></strong></p>
            <p><a href="index.html">Open the dashboard</a></p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/tracker.js"></script>
    <script>
        Tracker.onReady(function (user) {
            document.getElementById("userName").textContent = user.displayName || "";
            document.getElementById("userEmail").textContent = user.email || "";
            document.getElementById("userId").textContent = user.uid;
        });
    </script>
</body>
</html>
