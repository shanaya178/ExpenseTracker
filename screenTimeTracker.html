<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Screen Time Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
        rel="stylesheet"
        type="text/css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@5"
        rel="stylesheet"
        type="text/css"
    >

    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="bg-base-200 min-h-screen">

    <div id="auth-gate">
        <div class="auth-card">
            <p class="auth-kicker">My Dashboard</p>
            <h1 id="auth-title">Sign in to continue</h1>
            <p id="auth-status">Checking your Google session…</p>
            <button id="google-sign-in" type="button" hidden>
                <span class="g-logo" aria-hidden="true"></span>
                Sign in with Google
            </button>
            <p id="auth-error" role="alert"></p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-6">

        <p class="mb-4">
            <a href="index.html" class="link link-primary">
                ← Back to Dashboard
            </a>
        </p>

        <h1 class="text-4xl font-bold text-center mb-8">
            📱 Screen Time Tracker
        </h1>

        <div class="card bg-base-100 shadow-xl mb-8">

            <div class="card-body">

                <h2 id="formTitle" class="card-title mb-4">
                    Add Screen Time
                </h2>

                <form
                    id="screenTimeForm"
                    onsubmit="event.preventDefault(); saveSession()"
                >

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                App or Website
                            </span>
                        </div>

                        <input
                            id="appName"
                            type="text"
                            placeholder="Example: YouTube"
                            class="input input-bordered"
                            required
                        >

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Category
                            </span>
                        </div>

                        <select
                            id="category"
                            class="select select-bordered"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Social">
                                Social
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Games">
                                Games
                            </option>

                            <option value="Work">
                                Work
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Time Spent (minutes)
                            </span>
                        </div>

                        <input
                            id="minutes"
                            type="number"
                            placeholder="Example: 45"
                            class="input input-bordered"
                            min="1"
                            required
                        >

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Date
                            </span>
                        </div>

                        <input
                            id="date"
                            type="date"
                            class="input input-bordered"
                            required
                        >

                    </label>

                    <label class="form-control mb-6">

                        <div class="label">
                            <span class="label-text">
                                Notes
                            </span>
                        </div>

                        <input
                            id="notes"
                            type="text"
                            placeholder="Example: After dinner"
                            class="input input-bordered"
                        >

                    </label>

                    <div class="flex gap-3">

                        <button
                            id="saveButton"
                            type="submit"
                            class="btn btn-primary flex-1"
                        >
                            Add Screen Time
                        </button>

                        <button
                            id="cancelButton"
                            type="button"
                            onclick="cancelEdit()"
                            class="btn btn-neutral hidden"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <div class="card bg-base-100 shadow-xl mb-8">

            <div class="card-body">

                <h2 class="card-title">
                    🔎 Filters
                </h2>

                <div class="grid md:grid-cols-2 gap-4">

                    <label class="form-control">

                        <div class="label">
                            <span class="label-text">
                                Filter by Category
                            </span>
                        </div>

                        <select
                            id="categoryFilter"
                            onchange="loadSessions()"
                            class="select select-bordered"
                        >

                            <option value="All">
                                All Categories
                            </option>

                            <option value="Social">
                                Social
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Games">
                                Games
                            </option>

                            <option value="Work">
                                Work
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </label>

                    <label class="form-control">

                        <div class="label">
                            <span class="label-text">
                                Filter by Date
                            </span>
                        </div>

                        <input
                            id="dateFilter"
                            type="date"
                            onchange="loadSessions()"
                            class="input input-bordered"
                        >

                    </label>

                </div>

                <button
                    onclick="clearFilters()"
                    class="btn btn-outline mt-4"
                >
                    Clear Filters
                </button>

            </div>

        </div>

        <div class="stats shadow w-full mb-8">

            <div class="stat">

                <div class="stat-title">
                    Total Screen Time
                </div>

                <div
                    id="totalTime"
                    class="stat-value text-primary"
                >
                    0 minutes
                </div>

                <div class="stat-desc">
                    Based on current filters
                </div>

            </div>

            <div class="stat">

                <div class="stat-title">
                    Sessions
                </div>

                <div
                    id="sessionCount"
                    class="stat-value text-secondary"
                >
                    0
                </div>

                <div class="stat-desc">
                    Logged entries
                </div>

            </div>

        </div>

        <div
            id="categoryTotals"
            class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8"
        >
        </div>

        <div class="card bg-base-100 shadow-xl">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    📋 Screen Time List
                </h2>

                <div class="overflow-x-auto">

                    <table class="table table-zebra">

                        <thead>

                            <tr>

                                <th>#</th>
                                <th>App / Website</th>
                                <th>Category</th>
                                <th>Minutes</th>
                                <th>Date</th>
                                <th>Notes</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="sessionList">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/tracker.js"></script>

    <script>

        let sessions = [];

        let editingId = null;

        let saving = false;

        function formatTime(totalMinutes) {

            let hours = Math.floor(totalMinutes / 60);

            let minutes = totalMinutes % 60;

            if (hours === 0) {

                return minutes + " minutes";

            }

            return hours + " hours " + minutes + " minutes";

        }

        async function saveSession() {

            if (saving) {
                return;
            }

            let session = {

                appName:
                    document.getElementById("appName").value,

                category:
                    document.getElementById("category").value,

                minutes:
                    Number(
                        document.getElementById("minutes").value
                    ),

                date:
                    document.getElementById("date").value,

                notes:
                    document.getElementById("notes").value

            };

            saving = true;

            try {

                if (editingId === null) {

                    await Tracker.add("screenTime", session);

                } else {

                    await Tracker.update("screenTime", editingId, session);

                }

                document.getElementById("screenTimeForm").reset();

                editingId = null;

                document.getElementById("formTitle")
                    .innerText = "Add Screen Time";

                document.getElementById("saveButton")
                    .innerText = "Add Screen Time";

                document.getElementById("cancelButton")
                    .classList.add("hidden");

                sessions = await Tracker.load("screenTime");

                loadSessions();

            } catch (error) {

                Tracker.showBanner(Tracker.errorMessage(error));

            } finally {

                saving = false;

            }

        }

        function loadSessions() {

            let htmlString = "";

            let totalMinutes = 0;

            let count = 0;

            let selectedCategory =
                document.getElementById("categoryFilter").value;

            let selectedDate =
                document.getElementById("dateFilter").value;

            let categoryTotals = {};

            sessions.forEach(function (session) {

                let categoryMatches =
                    selectedCategory === "All" ||
                    session.category === selectedCategory;

                let dateMatches =
                    selectedDate === "" ||
                    session.date === selectedDate;

                if (!categoryMatches || !dateMatches) {

                    return;

                }

                totalMinutes = totalMinutes + Number(session.minutes);

                count = count + 1;

                if (categoryTotals[session.category] === undefined) {

                    categoryTotals[session.category] = 0;

                }

                categoryTotals[session.category] =
                    categoryTotals[session.category] + Number(session.minutes);

                htmlString += `

                    <tr>

                        <td>
                            ${count}
                        </td>

                        <td>
                            ${Tracker.escape(session.appName)}
                        </td>

                        <td>
                            ${Tracker.escape(session.category)}
                        </td>

                        <td>
                            ${Tracker.escape(session.minutes)}
                        </td>

                        <td>
                            ${Tracker.escape(session.date)}
                        </td>

                        <td>
                            ${Tracker.escape(session.notes)}
                        </td>

                        <td>

                            <button
                                onclick="editSession('${session.id}')"
                                class="btn btn-warning btn-sm mr-2"
                            >
                                Edit
                            </button>

                            <button
                                onclick="deleteSession('${session.id}')"
                                class="btn btn-error btn-sm"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });

            if (!htmlString) {

                htmlString = `
                    <tr>
                        <td colspan="7" class="text-center">
                            No screen time entries yet.
                        </td>
                    </tr>
                `;

            }

            document.getElementById("sessionList")
                .innerHTML = htmlString;

            document.getElementById("totalTime")
                .innerText = formatTime(totalMinutes);

            document.getElementById("sessionCount")
                .innerText = count;

            showCategoryTotals(categoryTotals);

        }

        function showCategoryTotals(categoryTotals) {

            let htmlString = "";

            for (let category in categoryTotals) {

                htmlString += `

                    <div class="card bg-base-100 shadow">

                        <div class="card-body">

                            <h3 class="font-bold">
                                ${Tracker.escape(category)}
                            </h3>

                            <p class="text-2xl text-primary">
                                ${formatTime(categoryTotals[category])}
                            </p>

                        </div>

                    </div>

                `;

            }

            document.getElementById("categoryTotals")
                .innerHTML = htmlString;

        }

        function editSession(id) {

            let session = sessions.find(function (item) {
                return item.id === id;
            });

            if (!session) {
                return;
            }

            document.getElementById("appName").value =
                session.appName;

            document.getElementById("category").value =
                session.category;

            document.getElementById("minutes").value =
                session.minutes;

            document.getElementById("date").value =
                session.date;

            document.getElementById("notes").value =
                session.notes;

            editingId = id;

            document.getElementById("formTitle")
                .innerText = "Edit Screen Time";

            document.getElementById("saveButton")
                .innerText = "Update Screen Time";

            document.getElementById("cancelButton")
                .classList.remove("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

        function cancelEdit() {

            editingId = null;

            document.getElementById("screenTimeForm")
                .reset();

            document.getElementById("formTitle")
                .innerText = "Add Screen Time";

            document.getElementById("saveButton")
                .innerText = "Add Screen Time";

            document.getElementById("cancelButton")
                .classList.add("hidden");

        }

        async function deleteSession(id) {

            let answer =
                confirm(
                    "Are you sure you want to delete this screen time entry?"
                );

            if (answer === false) {

                return;

            }

            try {

                await Tracker.remove("screenTime", id);

                if (editingId === id) {
                    cancelEdit();
                }

                sessions = await Tracker.load("screenTime");

                loadSessions();

            } catch (error) {

                Tracker.showBanner(Tracker.errorMessage(error));

            }

        }

        function clearFilters() {

            document.getElementById("categoryFilter")
                .value = "All";

            document.getElementById("dateFilter")
                .value = "";

            loadSessions();

        }

        Tracker.onReady(async function () {

            await Tracker.migrateLocalList("screenTime", "screenTime");

            sessions = await Tracker.load("screenTime");

            loadSessions();

        });

    </script>


</body>

</html>
