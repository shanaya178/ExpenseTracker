<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
        rel="stylesheet"
        type="text/css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@5"
        rel="stylesheet"
        type="text/css"
    >

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/pastel.css">

</head>

<body class="bg-base-200 min-h-screen">

    <div id="auth-gate">
        <div class="auth-card">
            <p class="auth-kicker">My Dashboard</p>
            <h1 id="auth-title">Sign in to continue</h1>
            <p id="auth-status">Checking your Google session…</p>
            <button id="google-sign-in" type="button" hidden>
                <span class="g-logo" aria-hidden="true"></span>
                Sign in with Google
            </button>
            <p id="auth-error" role="alert"></p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-6">

        <p class="mb-4">
            <a href="index.html" class="link link-primary">
                ← Back to Dashboard
            </a>
        </p>

        <h1 class="text-4xl font-bold text-center mb-8">
            💊 Medicine Tracker
        </h1>

        <!-- ADD MEDICINE -->

        <div class="card bg-base-100 shadow-xl mb-8">

            <div class="card-body">

                <h2 id="formTitle" class="card-title mb-4">
                    Add Medicine
                </h2>

                <form
                    id="medicineForm"
                    onsubmit="event.preventDefault(); saveMedicine()"
                >

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Medicine Name
                            </span>
                        </div>

                        <input
                            id="medicineName"
                            type="text"
                            placeholder="Example: Paracetamol"
                            class="input input-bordered"
                            required
                        >

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Type
                            </span>
                        </div>

                        <select
                            id="medicineType"
                            class="select select-bordered"
                            required
                        >

                            <option value="">
                                Select type
                            </option>

                            <option value="Tablet">
                                💊 Tablet
                            </option>

                            <option value="Capsule">
                                ⚪ Capsule
                            </option>

                            <option value="Syrup">
                                🧴 Syrup
                            </option>

                            <option value="Injection">
                                💉 Injection
                            </option>

                            <option value="Drops">
                                💧 Drops
                            </option>

                            <option value="Inhaler">
                                🌬️ Inhaler
                            </option>

                            <option value="Other">
                                📦 Other
                            </option>

                        </select>

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Dosage
                            </span>
                        </div>

                        <input
                            id="dosage"
                            type="text"
                            placeholder="Example: 500mg or 5ml"
                            class="input input-bordered"
                            required
                        >

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Frequency
                            </span>
                        </div>

                        <select
                            id="frequency"
                            class="select select-bordered"
                            required
                        >

                            <option value="">
                                Select frequency
                            </option>

                            <option value="Once daily">
                                Once daily
                            </option>

                            <option value="Twice daily">
                                Twice daily
                            </option>

                            <option value="Thrice daily">
                                Thrice daily
                            </option>

                            <option value="Weekly">
                                Weekly
                            </option>

                            <option value="As needed">
                                As needed
                            </option>

                        </select>

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Time to Take
                            </span>
                        </div>

                        <input
                            id="timeToTake"
                            type="time"
                            class="input input-bordered"
                            required
                        >

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Start Date
                            </span>
                        </div>

                        <input
                            id="startDate"
                            type="date"
                            class="input input-bordered"
                            required
                        >

                    </label>

                    <label class="form-control mb-4">

                        <div class="label">
                            <span class="label-text">
                                Quantity Remaining
                            </span>
                        </div>

                        <input
                            id="quantity"
                            type="number"
                            placeholder="Number of doses left"
                            class="input input-bordered"
                            min="0"
                            required
                        >

                    </label>

                    <label class="form-control mb-6">

                        <div class="label">
                            <span class="label-text">
                                Notes
                            </span>
                        </div>

                        <input
                            id="notes"
                            type="text"
                            placeholder="Example: After food"
                            class="input input-bordered"
                        >

                    </label>

                    <div class="flex gap-3">

                        <button
                            id="saveButton"
                            type="submit"
                            class="btn btn-primary flex-1"
                        >
                            Add Medicine
                        </button>

                        <button
                            id="cancelButton"
                            type="button"
                            onclick="cancelEdit()"
                            class="btn btn-neutral hidden"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <!-- FILTERS -->

        <div class="card bg-base-100 shadow-xl mb-8">

            <div class="card-body">

                <h2 class="card-title">
                    🔎 Filters
                </h2>

                <div class="grid md:grid-cols-2 gap-4">

                    <label class="form-control">

                        <div class="label">
                            <span class="label-text">
                                Filter by Type
                            </span>
                        </div>

                        <select
                            id="typeFilter"
                            onchange="loadMedicines()"
                            class="select select-bordered"
                        >

                            <option value="All">
                                All Types
                            </option>

                            <option value="Tablet">
                                Tablet
                            </option>

                            <option value="Capsule">
                                Capsule
                            </option>

                            <option value="Syrup">
                                Syrup
                            </option>

                            <option value="Injection">
                                Injection
                            </option>

                            <option value="Drops">
                                Drops
                            </option>

                            <option value="Inhaler">
                                Inhaler
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </label>

                    <label class="form-control">

                        <div class="label">
                            <span class="label-text">
                                Filter by Frequency
                            </span>
                        </div>

                        <select
                            id="frequencyFilter"
                            onchange="loadMedicines()"
                            class="select select-bordered"
                        >

                            <option value="All">
                                All Frequencies
                            </option>

                            <option value="Once daily">
                                Once daily
                            </option>

                            <option value="Twice daily">
                                Twice daily
                            </option>

                            <option value="Thrice daily">
                                Thrice daily
                            </option>

                            <option value="Weekly">
                                Weekly
                            </option>

                            <option value="As needed">
                                As needed
                            </option>

                        </select>

                    </label>

                </div>

                <button
                    onclick="clearFilters()"
                    class="btn btn-outline mt-4"
                >
                    Clear Filters
                </button>

            </div>

        </div>

        <!-- TOTALS -->

        <div class="stats shadow w-full mb-8">

            <div class="stat">

                <div class="stat-title">
                    Total Medicines
                </div>

                <div
                    id="totalMedicines"
                    class="stat-value text-primary"
                >
                    0
                </div>

                <div class="stat-desc">
                    Based on current filters
                </div>

            </div>

            <div class="stat">

                <div class="stat-title">
                    Low Stock
                </div>

                <div
                    id="lowStockCount"
                    class="stat-value text-warning"
                >
                    0
                </div>

                <div class="stat-desc">
                    5 or fewer doses left
                </div>

            </div>

        </div>

        <div
            id="typeTotals"
            class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"
        >
        </div>

        <!-- MEDICINE LIST -->

        <div class="card bg-base-100 shadow-xl">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    📋 Medicine List
                </h2>

                <div class="overflow-x-auto">

                    <table class="table table-zebra">

                        <thead>

                            <tr>

                                <th>#</th>
                                <th>Medicine</th>
                                <th>Type</th>
                                <th>Dosage</th>
                                <th>Frequency</th>
                                <th>Time</th>
                                <th>Start Date</th>
                                <th>Qty Left</th>
                                <th>Notes</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="medicineList">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/tracker.js"></script>

    <script>

        let medicines = [];

        let editingId = null;

        let saving = false;

        async function saveMedicine() {

            if (saving) {
                return;
            }

            let medicine = {

                name:
                    document.getElementById("medicineName").value,

                type:
                    document.getElementById("medicineType").value,

                dosage:
                    document.getElementById("dosage").value,

                frequency:
                    document.getElementById("frequency").value,

                timeToTake:
                    document.getElementById("timeToTake").value,

                startDate:
                    document.getElementById("startDate").value,

                quantity:
                    Number(
                        document.getElementById("quantity").value
                    ),

                notes:
                    document.getElementById("notes").value

            };

            saving = true;

            try {

                if (editingId === null) {

                    await Tracker.add("medicines", medicine);

                } else {

                    await Tracker.update("medicines", editingId, medicine);

                }

                document.getElementById("medicineForm").reset();

                editingId = null;

                document.getElementById("formTitle")
                    .innerText = "Add Medicine";

                document.getElementById("saveButton")
                    .innerText = "Add Medicine";

                document.getElementById("cancelButton")
                    .classList.add("hidden");

                medicines = await Tracker.load("medicines");

                loadMedicines();

            } catch (error) {

                Tracker.showBanner(Tracker.errorMessage(error));

            } finally {

                saving = false;

            }

        }

        function loadMedicines() {

            let htmlString = "";

            let total = 0;

            let lowStock = 0;

            let selectedType =
                document.getElementById("typeFilter").value;

            let selectedFrequency =
                document.getElementById("frequencyFilter").value;

            let typeTotals = {};

            let visibleNumber = 0;

            medicines.forEach(function (medicine) {

                let typeMatches =
                    selectedType === "All" ||
                    medicine.type === selectedType;

                let frequencyMatches =
                    selectedFrequency === "All" ||
                    medicine.frequency === selectedFrequency;

                if (!typeMatches || !frequencyMatches) {

                    return;

                }

                visibleNumber = visibleNumber + 1;

                total = total + 1;

                if (Number(medicine.quantity) <= 5) {

                    lowStock = lowStock + 1;

                }

                if (typeTotals[medicine.type] === undefined) {

                    typeTotals[medicine.type] = 0;

                }

                typeTotals[medicine.type] =
                    typeTotals[medicine.type] + 1;

                htmlString += `

                    <tr>

                        <td>
                            ${visibleNumber}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.name)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.type)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.dosage)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.frequency)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.timeToTake)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.startDate)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.quantity)}
                        </td>

                        <td>
                            ${Tracker.escape(medicine.notes)}
                        </td>

                        <td>

                            <button
                                onclick="editMedicine('${medicine.id}')"
                                class="btn btn-warning btn-sm mr-2"
                            >
                                Edit
                            </button>

                            <button
                                onclick="deleteMedicine('${medicine.id}')"
                                class="btn btn-error btn-sm"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });

            if (!htmlString) {

                htmlString = `
                    <tr>
                        <td colspan="10" class="text-center">
                            No medicines yet.
                        </td>
                    </tr>
                `;

            }

            document.getElementById("medicineList")
                .innerHTML = htmlString;

            document.getElementById("totalMedicines")
                .innerText = total;

            document.getElementById("lowStockCount")
                .innerText = lowStock;

            showTypeTotals(typeTotals);

        }

        function showTypeTotals(typeTotals) {

            let htmlString = "";

            for (let type in typeTotals) {

                htmlString += `

                    <div class="card bg-base-100 shadow">

                        <div class="card-body">

                            <h3 class="font-bold">
                                ${Tracker.escape(type)}
                            </h3>

                            <p class="text-2xl text-primary">
                                ${Tracker.escape(typeTotals[type])}
                            </p>

                        </div>

                    </div>

                `;

            }

            document.getElementById("typeTotals")
                .innerHTML = htmlString;

        }

        function editMedicine(id) {

            let medicine = medicines.find(function (item) {
                return item.id === id;
            });

            if (!medicine) {
                return;
            }

            document.getElementById("medicineName").value =
                medicine.name;

            document.getElementById("medicineType").value =
                medicine.type;

            document.getElementById("dosage").value =
                medicine.dosage;

            document.getElementById("frequency").value =
                medicine.frequency;

            document.getElementById("timeToTake").value =
                medicine.timeToTake;

            document.getElementById("startDate").value =
                medicine.startDate;

            document.getElementById("quantity").value =
                medicine.quantity;

            document.getElementById("notes").value =
                medicine.notes;

            editingId = id;

            document.getElementById("formTitle")
                .innerText = "Edit Medicine";

            document.getElementById("saveButton")
                .innerText = "Update Medicine";

            document.getElementById("cancelButton")
                .classList.remove("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

        function cancelEdit() {

            editingId = null;

            document.getElementById("medicineForm")
                .reset();

            document.getElementById("formTitle")
                .innerText = "Add Medicine";

            document.getElementById("saveButton")
                .innerText = "Add Medicine";

            document.getElementById("cancelButton")
                .classList.add("hidden");

        }

        async function deleteMedicine(id) {

            let answer =
                confirm(
                    "Are you sure you want to delete this medicine?"
                );

            if (answer === false) {

                return;

            }

            try {

                await Tracker.remove("medicines", id);

                if (editingId === id) {
                    cancelEdit();
                }

                medicines = await Tracker.load("medicines");

                loadMedicines();

            } catch (error) {

                Tracker.showBanner(Tracker.errorMessage(error));

            }

        }

        function clearFilters() {

            document.getElementById("typeFilter")
                .value = "All";

            document.getElementById("frequencyFilter")
                .value = "All";

            loadMedicines();

        }

        Tracker.onReady(async function () {

            await Tracker.migrateLocalList("medicines", "medicines");

            medicines = await Tracker.load("medicines");

            loadMedicines();

        });

    </script>


</body>

</html>
