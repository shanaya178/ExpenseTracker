<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        body {
            font-family: Nunito, "Segoe UI", sans-serif;
            margin: 0;
            padding: 30px;
            color: #4c4158;
            background:
                radial-gradient(circle at 8% 12%, #ffe4f1 0, transparent 28%),
                radial-gradient(circle at 90% 8%, #d9f6ea 0, transparent 26%),
                radial-gradient(circle at 80% 80%, #ffe8cf 0, transparent 24%),
                #fff7f2;
        }

        .box {
            max-width: 1000px;
            margin: auto;
            padding: 25px;
            border-radius: 24px;
            background: rgba(255, 253, 251, 0.92);
            box-shadow: 0 18px 40px rgba(176, 146, 168, 0.16);
        }

        h1 {
            text-align: center;
            color: #4c4158;
            font-family: Fraunces, Georgia, serif;
            font-weight: 560;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 12px;
            border: 1px solid #ead7e4;
            color: #4c4158;
            background: #fff;
        }

        button {
            background: #f6d0e2;
            color: #4c4158;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: #f0bdd4;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background: #f6d0e2;
            color: #4c4158;
            cursor: pointer;
        }

        td, th {
            padding: 10px;
            border: 1px solid #f0e0ea;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #fff4f8;
        }

        .delete {
            background: #f8cddd;
        }

        .edit {
            background: #ffe6c8;
        }

        .csv {
            background: #d7f3e4;
        }

        .pages {
            text-align: center;
            margin-top: 20px;
        }

        .empty {
            padding: 16px;
        }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="auth-card">
        <p class="auth-kicker">My Dashboard</p>
        <h1 id="auth-title">Sign in to continue</h1>
        <p id="auth-status">Checking your Google session…</p>
        <button id="google-sign-in" type="button" hidden>
            <span class="g-logo" aria-hidden="true"></span>
            Sign in with Google
        </button>
        <p id="auth-error" role="alert"></p>
    </div>
</div>

<div class="box">
    <h1>📚 My Library 💜</h1>

    <input id="title" placeholder="Book Name">
    <input id="author" placeholder="Author">

    <select id="status">
        <option>Want to Read</option>
        <option>Reading</option>
        <option>Completed</option>
    </select>

    <input id="rating" type="number" min="1" max="5" placeholder="Rating 1-5">

    <button onclick="addBook()">➕ Add Book</button>
    <button class="csv" onclick="exportCSV()">📥 CSV</button>

    <br><br>

    <select id="filter" onchange="page = 1; showBooks()">
        <option value="">All Books</option>
        <option>Want to Read</option>
        <option>Reading</option>
        <option>Completed</option>
    </select>

    <table>
        <thead>
            <tr>
                <th onclick="sortBooks('id')">ID ↕</th>
                <th onclick="sortBooks('title')">Book ↕</th>
                <th onclick="sortBooks('author')">Author ↕</th>
                <th onclick="sortBooks('status')">Status ↕</th>
                <th onclick="sortBooks('rating')">Rating ↕</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookList"></tbody>
    </table>

    <div class="pages">
        <button onclick="previous()">⬅ Previous</button>
        <b id="page">Page 1</b>
        <button onclick="next()">Next ➡</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="js/tracker.js"></script>
<script>
let books = [];
let page = 1;
let limit = 20;
let sortColumn = "id";
let ascending = true;
let saving = false;

function bookRows() {
    const filter = document.getElementById("filter").value;
    let rows = books.slice();

    if (filter) {
        rows = rows.filter(function (book) {
            return book.status === filter;
        });
    }

    const direction = ascending ? 1 : -1;

    rows.sort(function (a, b) {
        if (sortColumn === "id") {
            return (books.indexOf(a) - books.indexOf(b)) * direction;
        }

        const left = a[sortColumn] ?? "";
        const right = b[sortColumn] ?? "";

        if (sortColumn === "rating") {
            return ((Number(left) || 0) - (Number(right) || 0)) * direction;
        }

        return String(left).localeCompare(String(right)) * direction;
    });

    return rows;
}

async function addBook() {
    if (saving) {
        return;
    }

    const title = document.getElementById("title").value.trim();
    const author = document.getElementById("author").value.trim();
    const status = document.getElementById("status").value;
    const ratingRaw = document.getElementById("rating").value;

    if (!title) {
        alert("Please enter the book name!");
        return;
    }

    saving = true;

    try {
        await Tracker.add("books", {
            title: title,
            author: author,
            status: status,
            rating: ratingRaw === "" ? null : Number(ratingRaw)
        });

        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("rating").value = "";
        page = 1;
        books = await Tracker.load("books");
        showBooks();
    } catch (error) {
        Tracker.showBanner(Tracker.errorMessage(error));
    } finally {
        saving = false;
    }
}

function showBooks() {
    const rows = bookRows();
    const start = (page - 1) * limit;
    const data = rows.slice(start, start + limit);
    const list = document.getElementById("bookList");

    if (rows.length === 0) {
        list.innerHTML = '<tr><td class="empty" colspan="6">No books in this library yet.</td></tr>';
        document.getElementById("page").innerText = "Page " + page;
        return;
    }

    if (data.length === 0 && page > 1) {
        page = 1;
        showBooks();
        return;
    }

    list.innerHTML = data.map(function (book, index) {
        const rating = book.rating ? "⭐ " + Tracker.escape(book.rating) : "⭐ -";
        return "<tr>" +
            "<td>" + (start + index + 1) + "</td>" +
            "<td>📖 " + Tracker.escape(book.title) + "</td>" +
            "<td>" + Tracker.escape(book.author) + "</td>" +
            "<td>" + Tracker.escape(book.status) + "</td>" +
            "<td>" + rating + "</td>" +
            "<td>" +
            '<button class="edit" onclick="editBook(\'' + book.id + "')\">✏ Edit</button> " +
            '<button class="delete" onclick="deleteBook(\'' + book.id + "')\">🗑 Delete</button>" +
            "</td></tr>";
    }).join("");

    document.getElementById("page").innerText = "Page " + page;
}

async function editBook(id) {
    const book = books.find(function (item) {
        return item.id === id;
    });

    if (!book) {
        return;
    }

    const title = prompt("Book name:", book.title);
    const author = prompt("Author:", book.author || "");
    const status = prompt("Status (Want to Read / Reading / Completed):", book.status || "");
    const rating = prompt("Rating 1-5:", book.rating ?? "");

    if (title == null) {
        return;
    }

    try {
        await Tracker.update("books", id, {
            title: title,
            author: author,
            status: status,
            rating: rating === "" || rating == null ? null : Number(rating)
        });
        books = await Tracker.load("books");
        showBooks();
    } catch (error) {
        Tracker.showBanner(Tracker.errorMessage(error));
    }
}

async function deleteBook(id) {
    if (!confirm("Delete this book?")) {
        return;
    }

    try {
        await Tracker.remove("books", id);
        books = await Tracker.load("books");
        showBooks();
    } catch (error) {
        Tracker.showBanner(Tracker.errorMessage(error));
    }
}

function sortBooks(column) {
    if (sortColumn === column) {
        ascending = !ascending;
    } else {
        sortColumn = column;
        ascending = true;
    }

    showBooks();
}

function previous() {
    if (page > 1) {
        page--;
        showBooks();
    }
}

function next() {
    if (page * limit < bookRows().length) {
        page++;
        showBooks();
    }
}

function exportCSV() {
    if (!books.length) {
        alert("No books to export!");
        return;
    }

    const lines = ["ID,Book,Author,Status,Rating"];

    books.forEach(function (book, index) {
        lines.push([
            index + 1,
            csvCell(book.title),
            csvCell(book.author),
            csvCell(book.status),
            book.rating ?? ""
        ].join(","));
    });

    const file = new Blob([lines.join("\n")], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(file);
    link.download = "books.csv";
    link.click();
    URL.revokeObjectURL(link.href);
}

function csvCell(value) {
    return '"' + String(value ?? "").replace(/"/g, '""') + '"';
}

Tracker.onReady(async function () {
    books = await Tracker.load("books");
    showBooks();
});
</script>
</body>
</html>
