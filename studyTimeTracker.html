<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eff6ff;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .total {
            background: #2563eb;
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin: 25px 0;
        }

        .total h2 {
            font-size: 35px;
            margin: 5px;
        }

        .form {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        .session {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        .delete {
            background: #ef4444;
        }

        .empty {
            text-align: center;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="auth-card">
        <p class="auth-kicker">My Dashboard</p>
        <h1 id="auth-title">Sign in to continue</h1>
        <p id="auth-status">Checking your Google session…</p>
        <button id="google-sign-in" type="button" hidden>
            <span class="g-logo" aria-hidden="true"></span>
            Sign in with Google
        </button>
        <p id="auth-error" role="alert"></p>
    </div>
</div>

<div class="container">
    <h1>📖 Study Time Tracker</h1>

    <div class="total">
        <p>Total Study Time</p>
        <h2 id="totalHours">0 hours</h2>
    </div>

    <div class="form">
        <input id="subject" placeholder="Subject">
        <input id="time" type="number" placeholder="Study time in minutes">
        <input id="date" type="date">
        <button onclick="addSession()">Add Study Session</button>
    </div>

    <div id="sessionList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="js/tracker.js"></script>
<script>
    let sessions = [];
    let saving = false;

    function renderSessions() {
        const totalMinutes = sessions.reduce(function (sum, session) {
            return sum + Number(session.minutes || 0);
        }, 0);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        document.getElementById("totalHours").innerText =
            hours + " hours " + minutes + " minutes";

        const list = document.getElementById("sessionList");

        if (sessions.length === 0) {
            list.innerHTML = '<p class="empty">No study sessions yet.</p>';
            return;
        }

        list.innerHTML = sessions.map(function (session) {
            return '<div class="session">' +
                "<h3>📚 " + Tracker.escape(session.subject) + "</h3>" +
                "<p>⏱️ " + Tracker.escape(session.minutes) + " minutes</p>" +
                "<p>📅 " + Tracker.escape(session.date) + "</p>" +
                '<button class="delete" onclick="deleteSession(\'' + session.id + "')\">Delete</button>" +
                "</div>";
        }).join("");
    }

    async function addSession() {
        if (saving) {
            return;
        }

        const subject = document.getElementById("subject").value.trim();
        const time = Number(document.getElementById("time").value);
        const date = document.getElementById("date").value;

        if (!subject || !time || !date) {
            alert("Please fill all fields");
            return;
        }

        saving = true;

        try {
            await Tracker.add("studies", {
                subject: subject,
                minutes: time,
                date: date
            });
            document.getElementById("subject").value = "";
            document.getElementById("time").value = "";
            document.getElementById("date").value = "";
            sessions = await Tracker.load("studies");
            renderSessions();
        } catch (error) {
            Tracker.showBanner(Tracker.errorMessage(error));
        } finally {
            saving = false;
        }
    }

    async function deleteSession(id) {
        try {
            await Tracker.remove("studies", id);
            sessions = await Tracker.load("studies");
            renderSessions();
        } catch (error) {
            Tracker.showBanner(Tracker.errorMessage(error));
        }
    }

    Tracker.onReady(async function () {
        sessions = await Tracker.load("studies");
        renderSessions();
    });
</script>
</body>
</html>
