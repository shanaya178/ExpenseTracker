<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
            padding: 20px;
        }

        .box {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #777;
        }

        h1 {
            text-align: center;
            color: #7b2cbf;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 7px;
            border: 1px solid #aaa;
        }

        button {
            background: #7b2cbf;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #5a189a;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        td, th {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f8edff;
        }

        .delete {
            background: #e63946;
        }

        .edit {
            background: #ff9f1c;
        }

        .csv {
            background: #06a77d;
        }

        .pages {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="auth-card">
        <p class="auth-kicker">My Dashboard</p>
        <h1 id="auth-title">Sign in to continue</h1>
        <p id="auth-status">Checking your Google session…</p>
        <button id="google-sign-in" type="button" hidden>
            <span class="g-logo" aria-hidden="true"></span>
            Sign in with Google
        </button>
        <p id="auth-error" role="alert"></p>
    </div>
</div>

<div class="box">
    <h1>🌸 Student Manager 🌸</h1>

    <input id="name" placeholder="Student Name">
    <input id="grade" type="number" placeholder="Grade">
    <input id="dob" type="date">
    <input id="address" placeholder="Address">

    <button onclick="addStudent()">➕ Add</button>
    <button class="csv" onclick="exportCSV()">📥 CSV</button>

    <br><br>

    <select id="filter" onchange="page = 1; showStudents()">
        <option value="">All Grades</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
    </select>

    <table>
        <thead>
            <tr>
                <th onclick="sortStudents('roll')">Roll ↕</th>
                <th onclick="sortStudents('name')">Name ↕</th>
                <th onclick="sortStudents('grade')">Grade ↕</th>
                <th onclick="sortStudents('dob')">DOB ↕</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentList"></tbody>
    </table>

    <div class="pages">
        <button onclick="previousPage()">⬅ Previous</button>
        <b id="pageNumber">Page 1</b>
        <button onclick="nextPage()">Next ➡</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="js/tracker.js"></script>
<script>
let students = [];
let page = 1;
let limit = 20;
let sortColumn = "roll";
let ascending = true;
let saving = false;

function studentRows() {
    const grade = document.getElementById("filter").value;
    let rows = students.slice();

    if (grade) {
        rows = rows.filter(function (student) {
            return String(student.grade) === grade;
        });
    }

    const direction = ascending ? 1 : -1;

    rows.sort(function (a, b) {
        if (sortColumn === "roll") {
            return (students.indexOf(a) - students.indexOf(b)) * direction;
        }

        if (sortColumn === "grade") {
            return ((Number(a.grade) || 0) - (Number(b.grade) || 0)) * direction;
        }

        return String(a[sortColumn] ?? "").localeCompare(String(b[sortColumn] ?? "")) * direction;
    });

    return rows;
}

async function addStudent() {
    if (saving) {
        return;
    }

    const name = document.getElementById("name").value.trim();
    const grade = document.getElementById("grade").value;
    const dob = document.getElementById("dob").value;
    const address = document.getElementById("address").value.trim();

    if (!name || grade === "") {
        alert("Please enter name and grade!");
        return;
    }

    saving = true;

    try {
        await Tracker.add("students", {
            name: name,
            grade: Number(grade),
            dob: dob,
            address: address
        });

        document.getElementById("name").value = "";
        document.getElementById("grade").value = "";
        document.getElementById("dob").value = "";
        document.getElementById("address").value = "";
        page = 1;
        students = await Tracker.load("students");
        showStudents();
    } catch (error) {
        Tracker.showBanner(Tracker.errorMessage(error));
    } finally {
        saving = false;
    }
}

function showStudents() {
    const rows = studentRows();
    const start = (page - 1) * limit;
    const pageRows = rows.slice(start, start + limit);
    const list = document.getElementById("studentList");

    if (rows.length === 0) {
        list.innerHTML = '<tr><td colspan="6">No students yet.</td></tr>';
        document.getElementById("pageNumber").innerText = "Page " + page;
        return;
    }

    if (pageRows.length === 0 && page > 1) {
        page = 1;
        showStudents();
        return;
    }

    list.innerHTML = pageRows.map(function (student, index) {
        return "<tr>" +
            "<td>" + (start + index + 1) + "</td>" +
            "<td>" + Tracker.escape(student.name) + "</td>" +
            "<td>" + Tracker.escape(student.grade) + "</td>" +
            "<td>" + Tracker.escape(student.dob) + "</td>" +
            "<td>" + Tracker.escape(student.address) + "</td>" +
            "<td>" +
            '<button class="edit" onclick="editStudent(\'' + student.id + "')\">✏ Edit</button> " +
            '<button class="delete" onclick="deleteStudent(\'' + student.id + "')\">🗑 Delete</button>" +
            "</td></tr>";
    }).join("");

    document.getElementById("pageNumber").innerText = "Page " + page;
}

async function editStudent(id) {
    const student = students.find(function (item) {
        return item.id === id;
    });

    if (!student) {
        return;
    }

    const name = prompt("Name:", student.name);
    const grade = prompt("Grade:", student.grade);
    const dob = prompt("Date of Birth:", student.dob || "");
    const address = prompt("Address:", student.address || "");

    if (name == null || grade == null) {
        return;
    }

    try {
        await Tracker.update("students", id, {
            name: name,
            grade: Number(grade),
            dob: dob,
            address: address
        });
        students = await Tracker.load("students");
        showStudents();
    } catch (error) {
        Tracker.showBanner(Tracker.errorMessage(error));
    }
}

async function deleteStudent(id) {
    if (!confirm("Delete this student?")) {
        return;
    }

    try {
        await Tracker.remove("students", id);
        students = await Tracker.load("students");
        showStudents();
    } catch (error) {
        Tracker.showBanner(Tracker.errorMessage(error));
    }
}

function sortStudents(column) {
    if (sortColumn === column) {
        ascending = !ascending;
    } else {
        sortColumn = column;
        ascending = true;
    }

    showStudents();
}

function previousPage() {
    if (page > 1) {
        page--;
        showStudents();
    }
}

function nextPage() {
    if (page * limit < studentRows().length) {
        page++;
        showStudents();
    }
}

function exportCSV() {
    if (!students.length) {
        alert("No students found!");
        return;
    }

    let csv = "Roll Number,Name,Grade,Date of Birth,Address\n";

    students.forEach(function (student, index) {
        csv +=
            (index + 1) + "," +
            '"' + String(student.name).replace(/"/g, '""') + '",' +
            student.grade + "," +
            (student.dob || "") + "," +
            '"' + String(student.address || "").replace(/"/g, '""') + '"\n';
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "students.csv";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

Tracker.onReady(async function () {
    students = await Tracker.load("students");
    showStudents();
});
</script>
</body>
</html>
